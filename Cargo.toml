[package]
name = "worktable-vec"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Explicit Vec-backed baselines for WorkTable workloads"
repository = "https://github.com/pathscale/WorkTable-vec"
readme = "README.md"
keywords = ["worktable", "vec", "arctic", "benchmark"]
categories = ["data-structures"]

[features]
default = []
arctic = ["dep:arctic"]
congee = ["dep:congee"]
wti = ["dep:wti"]

[dependencies]
arctic = { package = "arctic-wt", version = "^0.1, >=0.1.9", optional = true }
congee = { package = "congee-wt", version = "^0.4, >=0.4.4", optional = true }
wti = { package = "WorkTablesIndex", version = "^0.0, >=0.0.11", optional = true, default-features = false, features = ["concurrent"] }

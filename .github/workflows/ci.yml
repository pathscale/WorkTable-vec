name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test --all-targets --no-default-features
      - run: cargo clippy --all-targets --features arctic -- -D warnings
      - run: cargo test --all-targets --features arctic
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      # A crate that says `#![no_std]` and is only ever built on a host with one
      # proves nothing. This target has no `std` to find.
      - run: cargo build --target x86_64-unknown-none --no-default-features
      - run: cargo build --target x86_64-unknown-none --no-default-features --features hydrate
      # The backends need an OS for their thread-local storage, so they cannot
      # be built for a bare target - but none of them may pull `std` in.
      - name: No backend enables std
        run: |
          for features in arctic congee wti arctic,congee,wti; do
            graph=$(cargo tree -e normal --no-default-features --features "$features" -f '{p} [{f}]')
            echo "--- $features"
            echo "$graph" | grep -E 'arctic-wt|congee-wt|WorkTablesIndex|ps-reclaim|parking_lot'
            if echo "$graph" | grep -E '(arctic-wt|congee-wt|WorkTablesIndex|ps-reclaim|parking_lot[a-z_]*) v[^[]*\[[^]]*std'; then
              echo "std leaked into --features $features"; exit 1
            fi
          done

  package:
    name: Release dry run
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [test, package]
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish when master carries a new version
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          version=$(cargo read-manifest | jq -er '.version')
          if cargo info "worktable-vec@$version" --registry crates-io >/dev/null 2>&1; then
            echo "worktable-vec $version is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish
